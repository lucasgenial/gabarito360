<h1 style="margin:0 0 16px;font-size:22px;line-height:1.25;">Nova mensagem do site</h1>
<table role="presentation" cellpadding="0" cellspacing="0" style="font-size:15px;line-height:1.5;">
  <tr><td style="padding:2px 12px 2px 0;color:#56637a;">Assunto</td><td>{{assunto}}</td></tr>
  <tr><td style="padding:2px 12px 2px 0;color:#56637a;">Nome</td><td>{{nome}}</td></tr>
  <tr><td style="padding:2px 12px 2px 0;color:#56637a;">E-mail</td><td>{{email}}</td></tr>
  <tr><td style="padding:2px 12px 2px 0;color:#56637a;">Celular</td><td>{{telefone}}</td></tr>
  <tr><td style="padding:2px 12px 2px 0;color:#56637a;">Instituição</td><td>{{instituicao}}</td></tr>
  <tr><td style="padding:2px 12px 2px 0;color:#56637a;">Cargo</td><td>{{cargo}}</td></tr>
</table>
<p style="margin:16px 0 0;">{{mensagem}}</p>
