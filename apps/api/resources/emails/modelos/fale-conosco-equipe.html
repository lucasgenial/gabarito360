<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{nome}} enviou uma mensagem pelo site.</div>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 12px;"><tr><td bgcolor="#dcf3f0" style="background-color:#dcf3f0;border-radius:4px;padding:4px 10px;font-size:12px;font-weight:700;color:#075e56;">Nova mensagem</td></tr></table>
<h1 class="titulo" style="margin:0 0 20px;font-size:26px;line-height:1.2;font-weight:800;color:#16233a;">{{assunto}}</h1>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px;font-size:15px;line-height:1.5;">
  <tr><td class="rotulo" width="120" style="width:120px;padding:9px 12px 9px 0;border-bottom:1px solid #dbe2ed;color:#56637a;">Nome</td><td class="valor" style="padding:9px 0;border-bottom:1px solid #dbe2ed;font-weight:600;">{{nome}}</td></tr>
  <tr><td class="rotulo" width="120" style="width:120px;padding:9px 12px 9px 0;border-bottom:1px solid #dbe2ed;color:#56637a;">E-mail</td><td class="valor" style="padding:9px 0;border-bottom:1px solid #dbe2ed;font-weight:600;">{{email}}</td></tr>
  <tr><td class="rotulo" width="120" style="width:120px;padding:9px 12px 9px 0;border-bottom:1px solid #dbe2ed;color:#56637a;">Celular</td><td class="valor" style="padding:9px 0;border-bottom:1px solid #dbe2ed;">{{telefone}}</td></tr>
  <tr><td class="rotulo" width="120" style="width:120px;padding:9px 12px 9px 0;border-bottom:1px solid #dbe2ed;color:#56637a;">Instituição</td><td class="valor" style="padding:9px 0;border-bottom:1px solid #dbe2ed;">{{instituicao}}</td></tr>
  <tr><td class="rotulo" width="120" style="width:120px;padding:9px 12px 9px 0;border-bottom:1px solid #dbe2ed;color:#56637a;">Cargo</td><td class="valor" style="padding:9px 0;border-bottom:1px solid #dbe2ed;">{{cargo}}</td></tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 16px;">
  <tr>
    <td bgcolor="#f4f6fa" style="background-color:#f4f6fa;border-radius:8px;padding:18px;font-size:15px;line-height:1.6;color:#16233a;">{{mensagem}}</td>
  </tr>
</table>
<p style="margin:0;font-size:14px;color:#56637a;">Use <strong>Responder</strong> para escrever direto a quem enviou.</p>
