components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: |
        UUID de correlacao opcional. Quando valido, e reutilizado na resposta;
        quando ausente ou invalido, a API gera um novo UUID.
      schema:
        $ref: "#/components/schemas/RequestId"
    NucleoId:
      name: nucleo
      in: path
      required: true
      description: UUID do nucleo.
      schema:
        type: string
        format: uuid
    EscolaId:
      name: escola
      in: path
      required: true
      description: UUID da escola.
      schema:
        type: string
        format: uuid
    TurmaId:
      name: turma
      in: path
      required: true
      description: UUID da turma.
      schema:
        type: string
        format: uuid
    MatriculaTurmaId:
      name: matricula
      in: path
      required: true
      description: UUID da matricula historica.
      schema:
        type: string
        format: uuid
    AlunoId:
      name: aluno
      in: path
      required: true
      description: UUID do aluno.
      schema:
        type: string
        format: uuid
    StudentImportId:
      name: importacao
      in: path
      required: true
      description: UUID do lote de importacao de alunos.
      schema:
        type: string
        format: uuid
    AplicadorTurmaId:
      name: vinculo
      in: path
      required: true
      description: UUID do vinculo operacional com a turma.
      schema:
        type: string
        format: uuid
    UsuarioId:
      name: usuario
      in: path
      required: true
      description: UUID do usuario.
      schema:
        type: string
        format: uuid
    VinculoPerfilId:
      name: vinculo
      in: path
      required: true
      description: UUID do vinculo de perfil.
      schema:
        type: string
        format: uuid
    ModeloCartaoId:
      name: modelo
      in: path
      required: true
      description: UUID da versao do modelo de cartao.
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: UUID de correlacao da requisicao.
      schema:
        $ref: "#/components/schemas/RequestId"
  responses:
    BadRequest:
      description: Requisicao malformada.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: BAD_REQUEST
              message: Requisicao invalida.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    Unauthorized:
      description: Credenciais ou token invalidos, revogados ou vinculados a usuario inativo.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHENTICATED
              message: Autenticacao necessaria.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    Forbidden:
      description: Dispositivo autenticado, mas revogado.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: DEVICE_REVOKED
              message: Dispositivo mobile revogado.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    AuthorizationForbidden:
      description: Usuario autenticado sem permissao para a operacao.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: FORBIDDEN
              message: Acao nao autorizada.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    NotFound:
      description: Recurso nao encontrado.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: Recurso nao encontrado.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    Conflict:
      description: Estado atual do recurso impede a operacao.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: CONFLICT
              message: Conflito ao processar a requisicao.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    UnprocessableEntity:
      description: Dados de entrada invalidos.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Os dados informados sao invalidos.
              details:
