openapi: 3.1.0
info:
  title: Gabarito360 API
  version: 0.6.0
  description: |
    Contrato OpenAPI da baseline tecnica, autenticacao e gestao inicial de nucleos, escolas e usuarios.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8000
    description: Ambiente local
tags:
  - name: Autenticacao
    description: Emissao e revogacao de tokens e contexto do usuario autenticado
  - name: Nucleos
    description: Cadastro, consulta, edicao e inativacao de nucleos de educacao
  - name: Escolas
    description: Gestao de escolas com isolamento pelo nucleo autorizado
  - name: Usuarios
    description: Gestao administrativa de usuarios, perfis e vinculos por escopo
  - name: Tecnico
    description: Endpoints tecnicos da API
paths:
  /api/v1/health:
    get:
      tags:
        - Tecnico
      summary: Verificar disponibilidade da API
      description: Retorna o estado basico da API sem consultar recursos de negocio.
      operationId: getApiHealth
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: API disponivel
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                data:
                  app: Gabarito360
                  status: online
                meta:
                  request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/login:
    post:
      tags:
        - Autenticacao
      summary: Autenticar usuario
      operationId: login
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Usuario autenticado e token emitido
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/logout:
    post:
      tags:
        - Autenticacao
      summary: Revogar token atual
      operationId: logout
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Token atual revogado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me:
    get:
      tags:
        - Autenticacao
      summary: Consultar usuario e contexto autorizado
      operationId: getAuthenticatedUser
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Usuario ativo e seus perfis, escopos e permissoes ativos
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/nucleos:
    get:
      tags:
        - Nucleos
      summary: Listar nucleos
      operationId: listEducationCenters
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/NucleoStatus"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 180
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Nucleos acessiveis ao administrador global
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Nucleos
      summary: Cadastrar nucleo
      operationId: createEducationCenter
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NucleoCreateRequest"
      responses:
        "201":
          description: Nucleo cadastrado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/nucleos/{nucleo}:
    parameters:
      - $ref: "#/components/parameters/NucleoId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      tags:
        - Nucleos
      summary: Consultar nucleo
      operationId: getEducationCenter
      security:
        - bearerToken: []
      responses:
        "200":
          description: Nucleo encontrado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Nucleos
      summary: Editar nucleo
      description: O codigo e o status nao podem ser alterados por este endpoint.
      operationId: updateEducationCenter
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NucleoUpdateRequest"
      responses:
        "200":
          description: Nucleo atualizado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Nucleos
      summary: Inativar nucleo
      description: Preserva o registro para consulta historica e altera somente o status para inativo.
      operationId: inactivateEducationCenter
      security:
        - bearerToken: []
      responses:
        "200":
          description: Nucleo inativado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/escolas:
    get:
      tags:
        - Escolas
      summary: Listar escolas acessiveis
      operationId: listSchools
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: nucleo_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/NucleoStatus"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 180
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Escolas filtradas pelo escopo autorizado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscolaListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Escolas
      summary: Cadastrar escola em nucleo ativo e autorizado
      operationId: createSchool
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscolaCreateRequest"
      responses:
        "201":
          description: Escola cadastrada
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscolaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/escolas/{escola}:
    parameters:
      - $ref: "#/components/parameters/EscolaId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      tags:
        - Escolas
      summary: Consultar escola no escopo autorizado
      operationId: getSchool
      security:
        - bearerToken: []
      responses:
        "200":
          description: Escola encontrada
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscolaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Escolas
      summary: Editar escola sem mover de nucleo
      description: Nucleo e status nao podem ser alterados por este endpoint.
      operationId: updateSchool
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscolaUpdateRequest"
      responses:
        "200":
          description: Escola atualizada
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscolaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Escolas
      summary: Inativar escola
      description: Preserva a escola para consulta historica e altera somente o status para inativo.
      operationId: inactivateSchool
      security:
        - bearerToken: []
      responses:
        "200":
          description: Escola inativada
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscolaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios no escopo autorizado
      operationId: listAdministrativeUsers
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UsuarioStatus"
        - name: nucleo_id
          in: query
          schema:
            type: string
            format: uuid
        - name: escola_id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
            maxLength: 180
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Usuarios e vinculos filtrados pelo escopo autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Usuarios
      summary: Cadastrar usuario com perfil inicial
      operationId: createAdministrativeUser
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioCreateRequest"
      responses:
        "201":
          description: Usuario cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAdministrativoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/usuarios/{usuario}:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      tags:
        - Usuarios
      summary: Consultar usuario e vinculos visiveis
      operationId: getAdministrativeUser
      security:
        - bearerToken: []
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAdministrativoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Usuarios
      summary: Atualizar dados administrativos do usuario
      description: Status e senha nao podem ser alterados por este endpoint.
      operationId: updateAdministrativeUser
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdateRequest"
      responses:
        "200":
          description: Usuario atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAdministrativoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/usuarios/{usuario}/perfis:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      tags:
        - Usuarios
      summary: Atribuir perfil ao usuario
      operationId: assignUserProfile
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilAssignmentRequest"
      responses:
        "201":
          description: Perfil atribuido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAdministrativoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/usuarios/{usuario}/perfis/{vinculo}:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
      - $ref: "#/components/parameters/VinculoPerfilId"
      - $ref: "#/components/parameters/XRequestId"
    delete:
      tags:
        - Usuarios
      summary: Revogar perfil preservando historico
      operationId: revokeUserProfile
      security:
        - bearerToken: []
      responses:
        "200":
          description: Perfil revogado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAdministrativoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/usuarios/{usuario}/inativar:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      tags:
        - Usuarios
      summary: Inativar usuario e revogar seus acessos
      operationId: inactivateAdministrativeUser
      security:
        - bearerToken: []
      responses:
        "200":
          description: Usuario inativado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAdministrativoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/perfis:
    get:
      tags:
        - Usuarios
      summary: Listar catalogo ativo de perfis
      operationId: listActiveProfiles
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Catalogo de perfis disponiveis para atribuicao autorizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: |
        UUID de correlacao opcional. Quando valido, e reutilizado na resposta;
        quando ausente ou invalido, a API gera um novo UUID.
      schema:
        $ref: "#/components/schemas/RequestId"
    NucleoId:
      name: nucleo
      in: path
      required: true
      description: UUID do nucleo.
      schema:
        type: string
        format: uuid
    EscolaId:
      name: escola
      in: path
      required: true
      description: UUID da escola.
      schema:
        type: string
        format: uuid
    UsuarioId:
      name: usuario
      in: path
      required: true
      description: UUID do usuario.
      schema:
        type: string
        format: uuid
    VinculoPerfilId:
      name: vinculo
      in: path
      required: true
      description: UUID do vinculo de perfil.
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: UUID de correlacao da requisicao.
      schema:
        $ref: "#/components/schemas/RequestId"
  responses:
    BadRequest:
      description: Requisicao malformada.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: BAD_REQUEST
              message: Requisicao invalida.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    Unauthorized:
      description: Credenciais ou token invalidos, revogados ou vinculados a usuario inativo.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHENTICATED
              message: Autenticacao necessaria.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    Forbidden:
      description: Dispositivo autenticado, mas revogado.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: DEVICE_REVOKED
              message: Dispositivo mobile revogado.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    AuthorizationForbidden:
      description: Usuario autenticado sem permissao para a operacao.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: FORBIDDEN
              message: Acao nao autorizada.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    NotFound:
      description: Recurso nao encontrado.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: Recurso nao encontrado.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    UnprocessableEntity:
      description: Dados de entrada invalidos.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Os dados informados sao invalidos.
              details:
                email:
                  - O campo email e obrigatorio.
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    UpgradeRequired:
      description: Versao do aplicativo mobile abaixo da minima aceita.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: APP_VERSION_UNSUPPORTED
              message: Atualize o aplicativo para continuar.
              details:
                minimum_version: 1.0.0
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    TooManyRequests:
      description: Limite de tentativas de login excedido.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: Muitas requisicoes. Tente novamente mais tarde.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    InternalServerError:
      description: Falha interna sem exposicao de detalhes sensiveis.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
