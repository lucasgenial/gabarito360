openapi: 3.1.0
info:
  title: Gabarito360 API
  version: 0.16.0
  description: |
    Contrato OpenAPI da baseline tecnica, autenticacao, gestao organizacional, turmas, alunos,
    vinculos operacionais, importacao validada de alunos por CSV, modelos versionados de cartao OMR
    provas, questoes, versoes de gabarito oficial, publicacao e vinculos autorizados com turmas.
    A R6 implementa o ciclo operacional de aplicacoes, leituras, revisao,
    confirmacao idempotente, resultados, dashboard e relatorio CSV.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8000
    description: Ambiente local
x-gabarito360-r6-contracts:
  status: operational-flow-implemented
  documentation: docs/18-contrato-r6-integracao-operacional.md
  resources:
    academic:
      - periodos_letivos
      - series_anos
      - disciplinas
      - temas_habilidades
    staff:
      - cargos
      - usuario_lotacoes
      - usuario_disciplinas
    operations:
      - aplicacoes
      - aplicacao_aplicadores
      - aplicacao_alunos
      - cartoes_resposta
      - leituras_cartao
      - respostas_detectadas
    analytics:
      - resultados
      - resultado_questoes
      - relatorios
  blockedUntilHomologation:
    - real OMR accuracy gate
    - physical device performance gate
tags:
  - name: Autenticacao
    description: Emissao e revogacao de tokens e contexto do usuario autenticado
  - name: Nucleos
    description: Cadastro, consulta, edicao e inativacao de nucleos de educacao
  - name: Escolas
    description: Gestao de escolas com isolamento pelo nucleo autorizado
  - name: Usuarios
    description: Gestao administrativa de usuarios, perfis e vinculos por escopo
  - name: Turmas
    description: Gestao de turmas por ano letivo e matriculas historicas
  - name: Alunos
    description: Gestao de alunos com dados minimizados e isolamento por escopo
  - name: Modelos de cartao
    description: Configuracoes OMR versionadas, homologadas e imutaveis
  - name: Provas
    description: Provas e questoes editaveis somente enquanto estao em rascunho
  - name: Estrutura academica
    description: Periodos, series, disciplinas e temas da fundacao R3
  - name: Aplicacoes
    description: Ciclo operacional, leituras, revisao, confirmacao e dashboard
  - name: Resultados e relatorios
    description: Calculo, consulta e exportacao autorizada
  - name: Tecnico
    description: Endpoints tecnicos da API
paths:
  /api/v1/health:
    get:
      tags:
        - Tecnico
      summary: Verificar disponibilidade da API
      description: Retorna o estado basico da API sem consultar recursos de negocio.
      operationId: getApiHealth
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: API disponivel
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                data:
                  app: Gabarito360
                  status: online
                meta:
                  request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/login:
    post:
      tags:
        - Autenticacao
      summary: Autenticar usuario
      operationId: login
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Usuario autenticado e token emitido
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/logout:
    post:
      tags:
        - Autenticacao
      summary: Revogar token atual
      operationId: logout
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Token atual revogado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me:
    get:
      tags:
        - Autenticacao
      summary: Consultar usuario e contexto autorizado
      operationId: getAuthenticatedUser
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Usuario ativo e seus perfis, escopos e permissoes ativos
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/nucleos:
    get:
      tags:
        - Nucleos
      summary: Listar nucleos
      operationId: listEducationCenters
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/NucleoStatus"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 180
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Nucleos acessiveis ao administrador global
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Nucleos
      summary: Cadastrar nucleo
      operationId: createEducationCenter
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NucleoCreateRequest"
      responses:
        "201":
          description: Nucleo cadastrado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/nucleos/{nucleo}:
    parameters:
      - $ref: "#/components/parameters/NucleoId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      tags:
        - Nucleos
      summary: Consultar nucleo
      operationId: getEducationCenter
      security:
        - bearerToken: []
      responses:
        "200":
          description: Nucleo encontrado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Nucleos
      summary: Editar nucleo
      description: O codigo e o status nao podem ser alterados por este endpoint.
      operationId: updateEducationCenter
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NucleoUpdateRequest"
      responses:
        "200":
          description: Nucleo atualizado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Nucleos
      summary: Inativar nucleo
      description: Preserva o registro para consulta historica e altera somente o status para inativo.
      operationId: inactivateEducationCenter
      security:
        - bearerToken: []
      responses:
        "200":
          description: Nucleo inativado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/escolas:
    get:
      tags:
        - Escolas
      summary: Listar escolas acessiveis
      operationId: listSchools
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: nucleo_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/NucleoStatus"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 180
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Escolas filtradas pelo escopo autorizado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscolaListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Escolas
      summary: Cadastrar escola em nucleo ativo e autorizado
      operationId: createSchool
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscolaCreateRequest"
      responses:
        "201":
          description: Escola cadastrada
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscolaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/escolas/{escola}:
    parameters:
      - $ref: "#/components/parameters/EscolaId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      tags:
