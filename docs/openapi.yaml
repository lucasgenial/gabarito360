      required:
        - identificador
        - plataforma
        - versao_app
      description: |
        Identifica uma instalacao do app por UUID gerado localmente.
        IMEI, serial e outros identificadores invasivos nao sao aceitos.
      properties:
        identificador:
          type: string
          format: uuid
        plataforma:
          type: string
          const: android
        modelo_dispositivo:
          type:
            - string
            - "null"
          maxLength: 120
        versao_sistema:
          type:
            - string
            - "null"
          maxLength: 50
        versao_app:
          type: string
          maxLength: 30
          pattern: '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$'
