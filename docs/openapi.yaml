          description: Respostas oficiais ordenadas pelo numero da questao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GabaritoRespostaListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/provas/{prova}/gabaritos/{gabarito}/respostas/{questao}:
    parameters:
      - $ref: "#/components/parameters/ProvaId"
      - $ref: "#/components/parameters/GabaritoId"
      - $ref: "#/components/parameters/QuestaoId"
      - $ref: "#/components/parameters/XRequestId"
    put:
      tags:
        - Provas
      summary: Criar ou substituir resposta oficial da questao
      description: |
        Operacao idempotente permitida somente em prova e gabarito rascunho.
        Questao anulada exige alternativa correta nula.
      operationId: upsertExamAnswerKeyResponse
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GabaritoRespostaUpsertRequest"
      responses:
        "200":
          description: Resposta oficial criada ou atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GabaritoRespostaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/provas/{prova}/gabaritos/{gabarito}/validacao:
    parameters:
      - $ref: "#/components/parameters/ProvaId"
