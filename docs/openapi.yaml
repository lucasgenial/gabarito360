        - Alunos
      summary: Listar alunos autorizados
      operationId: listStudents
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: escola_id
          in: query
          schema:
            type: string
            format: uuid
        - name: turma_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/NucleoStatus"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 180
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Alunos no escopo autorizado; perfis operacionais recebem recurso reduzido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlunoListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Alunos
      summary: Cadastrar aluno com dados minimos
      operationId: createStudent
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlunoCreateRequest"
      responses:
        "201":
          description: Aluno cadastrado
          content:
            application/json:
              schema:
