    ModeloCartaoConfiguracaoOmr:
      type: object
      description: |
        Configuracao versionada completa. Deve declarar canvas, marcadores, regiao e
        normalizacao do codigo impresso, grade de respostas e limiares explicitos.
      additionalProperties: true
      required:
        - spec_id
        - spec_version
        - canvas
        - markers
        - printed_code
        - answers
        - thresholds
      properties:
        spec_id:
          type: string
        spec_version:
          type: string
        canvas:
          type: object
          additionalProperties: true
        markers:
          type: object
          additionalProperties: true
        printed_code:
          type: object
          additionalProperties: true
        answers:
          type: object
          additionalProperties: true
        thresholds:
          type: object
          additionalProperties: true
    ModeloCartao:
      type: object
      additionalProperties: false
      required:
        - id
        - nucleo_id
        - nome
        - versao
        - quantidade_questoes
        - quantidade_alternativas
        - alternativas
        - tipo_codigo
        - origem_codigo
        - configuracao_omr
        - artefato_checksum_sha256
        - status
        - criado_por
        - homologado_por
        - homologado_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        nucleo_id:
          type:
            - string
            - "null"
          format: uuid
        nome:
          type: string
          maxLength: 120
        versao:
          type: integer
          minimum: 1
        quantidade_questoes:
          type: integer
          minimum: 1
          maximum: 500
        quantidade_alternativas:
          type: integer
          minimum: 2
          maximum: 10
        alternativas:
          type: array
          minItems: 2
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z0-9]$"
        tipo_codigo:
          $ref: "#/components/schemas/ModeloCartaoTipoCodigo"
        origem_codigo:
          $ref: "#/components/schemas/ModeloCartaoOrigemCodigo"
        configuracao_omr:
          $ref: "#/components/schemas/ModeloCartaoConfiguracaoOmr"
        artefato_checksum_sha256:
          type:
            - string
            - "null"
          pattern: "^[0-9a-f]{64}$"
        status:
          $ref: "#/components/schemas/ModeloCartaoStatus"
        criado_por:
          type:
            - string
            - "null"
          format: uuid
        homologado_por:
          type:
            - string
            - "null"
          format: uuid
        homologado_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
