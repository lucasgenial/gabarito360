            application/json:
              schema:
                $ref: "#/components/schemas/EscolaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Escolas
      summary: Editar escola sem mover de nucleo
      description: Nucleo e status nao podem ser alterados por este endpoint.
      operationId: updateSchool
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscolaUpdateRequest"
      responses:
        "200":
          description: Escola atualizada
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscolaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Escolas
      summary: Inativar escola
      description: Preserva a escola para consulta historica e altera somente o status para inativo.
      operationId: inactivateSchool
      security:
        - bearerToken: []
      responses:
        "200":
          description: Escola inativada
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscolaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios no escopo autorizado
      operationId: listAdministrativeUsers
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UsuarioStatus"
        - name: nucleo_id
          in: query
          schema:
            type: string
            format: uuid
        - name: escola_id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
            maxLength: 180
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Usuarios e vinculos filtrados pelo escopo autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
