        - bearerToken: []
      responses:
        "200":
          description: Resumo de completude calculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GabaritoValidacaoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/aplicacoes:
    get:
      tags: [Aplicacoes]
      summary: Listar aplicacoes autorizadas
      operationId: listApplications
      security: [{ bearerToken: [] }]
      responses:
        "200": { description: Aplicacoes autorizadas }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Aplicacoes]
      summary: Criar aplicacao e snapshot de alunos
      operationId: createApplication
      security: [{ bearerToken: [] }]
      responses:
        "201": { description: Aplicacao criada }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/aplicacoes/{aplicacao}/iniciar:
    parameters:
      - { name: aplicacao, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Aplicacoes]
      summary: Iniciar aplicacao autorizada
      operationId: startApplication
      security: [{ bearerToken: [] }]
      responses:
        "200": { description: Aplicacao iniciada }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/aplicacoes/{aplicacao}/leituras:
    parameters:
      - { name: aplicacao, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Aplicacoes]
      summary: Registrar leitura preliminar
      operationId: createPreliminaryReading
      security: [{ bearerToken: [] }]
      responses:
        "201": { description: Leitura preliminar registrada }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/leituras/{leitura}/revisar:
    parameters:
      - { name: leitura, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Aplicacoes]
      summary: Registrar revisao manual auditada
      operationId: reviewReading
      security: [{ bearerToken: [] }]
      responses:
        "200": { description: Leitura revisada }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/leituras/{leitura}/confirmar:
    parameters:
      - { name: leitura, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 80 } }
    post:
      tags: [Aplicacoes]
      summary: Confirmar leitura e calcular resultado
      operationId: confirmReading
      security: [{ bearerToken: [] }]
      responses:
        "200": { description: Leitura confirmada e resultado calculado }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/aplicacoes/{aplicacao}/dashboard:
    parameters:
      - { name: aplicacao, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Aplicacoes]
      summary: Obter snapshot de progresso
      operationId: getApplicationDashboard
      security: [{ bearerToken: [] }]
      responses:
        "200": { description: Metricas derivadas do banco }
        "403": { $ref: "#/components/responses/AuthorizationForbidden" }
  /api/v1/aplicacoes/{aplicacao}/relatorios:
    parameters:
      - { name: aplicacao, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Resultados e relatorios]
      summary: Gerar relatorio CSV privado
      operationId: createApplicationReport
      security: [{ bearerToken: [] }]
      responses:
        "201": { description: Relatorio concluido }
        "403": { $ref: "#/components/responses/AuthorizationForbidden" }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: |
        UUID de correlacao opcional. Quando valido, e reutilizado na resposta;
        quando ausente ou invalido, a API gera um novo UUID.
      schema:
        $ref: "#/components/schemas/RequestId"
    NucleoId:
      name: nucleo
      in: path
      required: true
      description: UUID do nucleo.
      schema:
        type: string
        format: uuid
    EscolaId:
      name: escola
      in: path
      required: true
      description: UUID da escola.
      schema:
        type: string
        format: uuid
    TurmaId:
      name: turma
      in: path
      required: true
      description: UUID da turma.
      schema:
        type: string
        format: uuid
    MatriculaTurmaId:
      name: matricula
      in: path
      required: true
      description: UUID da matricula historica.
      schema:
        type: string
        format: uuid
    AlunoId:
      name: aluno
      in: path
      required: true
      description: UUID do aluno.
      schema:
        type: string
        format: uuid
    StudentImportId:
      name: importacao
      in: path
      required: true
      description: UUID do lote de importacao de alunos.
      schema:
        type: string
        format: uuid
    AplicadorTurmaId:
      name: vinculo
      in: path
      required: true
      description: UUID do vinculo operacional com a turma.
      schema:
        type: string
        format: uuid
    UsuarioId:
      name: usuario
      in: path
      required: true
      description: UUID do usuario.
      schema:
        type: string
        format: uuid
    VinculoPerfilId:
      name: vinculo
      in: path
      required: true
      description: UUID do vinculo de perfil.
      schema:
        type: string
        format: uuid
    ModeloCartaoId:
      name: modelo
      in: path
      required: true
      description: UUID da versao do modelo de cartao.
      schema:
        type: string
        format: uuid
    ProvaId:
      name: prova
      in: path
      required: true
      description: UUID da prova.
      schema:
        type: string
        format: uuid
    QuestaoId:
      name: questao
      in: path
      required: true
      description: UUID da questao pertencente a prova.
      schema:
        type: string
        format: uuid
    GabaritoId:
      name: gabarito
      in: path
      required: true
      description: UUID da versao de gabarito oficial pertencente a prova.
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: UUID de correlacao da requisicao.
      schema:
        $ref: "#/components/schemas/RequestId"
  responses:
    BadRequest:
      description: Requisicao malformada.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: BAD_REQUEST
              message: Requisicao invalida.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    Unauthorized:
      description: Credenciais ou token invalidos, revogados ou vinculados a usuario inativo.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHENTICATED
              message: Autenticacao necessaria.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    Forbidden:
      description: Dispositivo autenticado, mas revogado.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: DEVICE_REVOKED
              message: Dispositivo mobile revogado.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    AuthorizationForbidden:
      description: Usuario autenticado sem permissao para a operacao.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: FORBIDDEN
              message: Acao nao autorizada.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    NotFound:
      description: Recurso nao encontrado.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: Recurso nao encontrado.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    Conflict:
      description: Estado atual do recurso impede a operacao.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: CONFLICT
              message: Conflito ao processar a requisicao.
              details: {}
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    UnprocessableEntity:
      description: Dados de entrada invalidos.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Os dados informados sao invalidos.
              details:
                email:
                  - O campo email e obrigatorio.
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    UpgradeRequired:
      description: Versao do aplicativo mobile abaixo da minima aceita.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: APP_VERSION_UNSUPPORTED
              message: Atualize o aplicativo para continuar.
              details:
                minimum_version: 1.0.0
            meta:
              request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
    TooManyRequests:
      description: Limite de tentativas de login excedido.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
