        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/provas/{prova}/gabaritos/{gabarito}:
    parameters:
      - $ref: "#/components/parameters/ProvaId"
