        Publica atomicamente a prova em rascunho e o gabarito oficial selecionado.
        Exige modelo de cartao homologado, configuracao valida, todas as questoes ativas
        cadastradas e uma resposta oficial para cada questao.
      operationId: publishExam
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvaPublishRequest"
      responses:
        "200":
          description: Prova publicada e gabarito selecionado tornado vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvaPublishResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/provas/{prova}/turmas:
    parameters:
      - $ref: "#/components/parameters/ProvaId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      tags:
