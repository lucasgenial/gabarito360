openapi: 3.1.0
info:
  title: Gabarito360 API
  version: 0.10.0
  description: |
    Contrato OpenAPI da baseline tecnica, autenticacao, gestao organizacional, turmas, alunos,
    vinculos operacionais, importacao validada de alunos por CSV e modelos versionados de cartao OMR.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8000
    description: Ambiente local
tags:
  - name: Autenticacao
    description: Emissao e revogacao de tokens e contexto do usuario autenticado
  - name: Nucleos
    description: Cadastro, consulta, edicao e inativacao de nucleos de educacao
  - name: Escolas
    description: Gestao de escolas com isolamento pelo nucleo autorizado
  - name: Usuarios
    description: Gestao administrativa de usuarios, perfis e vinculos por escopo
  - name: Turmas
    description: Gestao de turmas por ano letivo e matriculas historicas
  - name: Alunos
    description: Gestao de alunos com dados minimizados e isolamento por escopo
  - name: Modelos de cartao
    description: Configuracoes OMR versionadas, homologadas e imutaveis
  - name: Tecnico
    description: Endpoints tecnicos da API
paths:
  /api/v1/health:
    get:
      tags:
        - Tecnico
      summary: Verificar disponibilidade da API
      description: Retorna o estado basico da API sem consultar recursos de negocio.
      operationId: getApiHealth
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: API disponivel
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                data:
                  app: Gabarito360
                  status: online
                meta:
                  request_id: 2f87b442-6bca-4bb3-9038-1e6a845103bd
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/login:
    post:
      tags:
        - Autenticacao
      summary: Autenticar usuario
      operationId: login
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Usuario autenticado e token emitido
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/logout:
    post:
      tags:
        - Autenticacao
      summary: Revogar token atual
      operationId: logout
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Token atual revogado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me:
    get:
      tags:
        - Autenticacao
      summary: Consultar usuario e contexto autorizado
      operationId: getAuthenticatedUser
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Usuario ativo e seus perfis, escopos e permissoes ativos
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/nucleos:
    get:
      tags:
        - Nucleos
      summary: Listar nucleos
      operationId: listEducationCenters
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/NucleoStatus"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 180
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Nucleos acessiveis ao administrador global
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Nucleos
      summary: Cadastrar nucleo
      operationId: createEducationCenter
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NucleoCreateRequest"
      responses:
        "201":
          description: Nucleo cadastrado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/nucleos/{nucleo}:
    parameters:
      - $ref: "#/components/parameters/NucleoId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      tags:
        - Nucleos
      summary: Consultar nucleo
      operationId: getEducationCenter
      security:
        - bearerToken: []
      responses:
        "200":
          description: Nucleo encontrado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Nucleos
      summary: Editar nucleo
      description: O codigo e o status nao podem ser alterados por este endpoint.
      operationId: updateEducationCenter
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NucleoUpdateRequest"
      responses:
        "200":
          description: Nucleo atualizado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Nucleos
      summary: Inativar nucleo
      description: Preserva o registro para consulta historica e altera somente o status para inativo.
      operationId: inactivateEducationCenter
      security:
        - bearerToken: []
      responses:
        "200":
          description: Nucleo inativado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/escolas:
    get:
      tags:
        - Escolas
      summary: Listar escolas acessiveis
      operationId: listSchools
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: nucleo_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/NucleoStatus"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 180
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Escolas filtradas pelo escopo autorizado
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscolaListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Escolas
      summary: Cadastrar escola em nucleo ativo e autorizado
      operationId: createSchool
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscolaCreateRequest"
      responses:
        "201":
          description: Escola cadastrada
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscolaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/escolas/{escola}:
    parameters:
      - $ref: "#/components/parameters/EscolaId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      tags:
        - Escolas
      summary: Consultar escola no escopo autorizado
      operationId: getSchool
      security:
        - bearerToken: []
      responses:
        "200":
          description: Escola encontrada
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscolaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Escolas
      summary: Editar escola sem mover de nucleo
      description: Nucleo e status nao podem ser alterados por este endpoint.
      operationId: updateSchool
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscolaUpdateRequest"
      responses:
        "200":
          description: Escola atualizada
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscolaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Escolas
      summary: Inativar escola
      description: Preserva a escola para consulta historica e altera somente o status para inativo.
      operationId: inactivateSchool
      security:
        - bearerToken: []
      responses:
        "200":
          description: Escola inativada
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscolaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios no escopo autorizado
      operationId: listAdministrativeUsers
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UsuarioStatus"
        - name: nucleo_id
          in: query
          schema:
            type: string
            format: uuid
        - name: escola_id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
            maxLength: 180
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Usuarios e vinculos filtrados pelo escopo autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Usuarios
      summary: Cadastrar usuario com perfil inicial
      operationId: createAdministrativeUser
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioCreateRequest"
      responses:
        "201":
          description: Usuario cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAdministrativoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/usuarios/{usuario}:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      tags:
        - Usuarios
      summary: Consultar usuario e vinculos visiveis
      operationId: getAdministrativeUser
      security:
        - bearerToken: []
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAdministrativoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Usuarios
      summary: Atualizar dados administrativos do usuario
      description: Status e senha nao podem ser alterados por este endpoint.
      operationId: updateAdministrativeUser
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdateRequest"
      responses:
        "200":
          description: Usuario atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAdministrativoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/usuarios/{usuario}/perfis:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      tags:
        - Usuarios
      summary: Atribuir perfil ao usuario
      operationId: assignUserProfile
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilAssignmentRequest"
      responses:
        "201":
          description: Perfil atribuido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAdministrativoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/usuarios/{usuario}/perfis/{vinculo}:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
      - $ref: "#/components/parameters/VinculoPerfilId"
      - $ref: "#/components/parameters/XRequestId"
    delete:
      tags:
        - Usuarios
      summary: Revogar perfil preservando historico
      operationId: revokeUserProfile
      security:
        - bearerToken: []
      responses:
        "200":
          description: Perfil revogado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAdministrativoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/usuarios/{usuario}/inativar:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      tags:
        - Usuarios
      summary: Inativar usuario e revogar seus acessos
      operationId: inactivateAdministrativeUser
      security:
        - bearerToken: []
      responses:
        "200":
          description: Usuario inativado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAdministrativoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/perfis:
    get:
      tags:
        - Usuarios
      summary: Listar catalogo ativo de perfis
      operationId: listActiveProfiles
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Catalogo de perfis disponiveis para atribuicao autorizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/alunos:
    get:
      tags:
        - Alunos
      summary: Listar alunos autorizados
      operationId: listStudents
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: escola_id
          in: query
          schema:
            type: string
            format: uuid
        - name: turma_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/NucleoStatus"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 180
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Alunos no escopo autorizado; perfis operacionais recebem recurso reduzido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlunoListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Alunos
      summary: Cadastrar aluno com dados minimos
      operationId: createStudent
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlunoCreateRequest"
      responses:
        "201":
          description: Aluno cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlunoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/alunos/importacoes:
    post:
      tags:
        - Alunos
      summary: Enviar e validar previamente uma importacao CSV de alunos
      operationId: createStudentImport
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StudentImportCreateRequest"
      responses:
        "201":
          description: Lote persistido com resumo da validacao previa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentImportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/alunos/importacoes/{importacao}:
    parameters:
      - $ref: "#/components/parameters/StudentImportId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      tags:
        - Alunos
      summary: Consultar estado e resultado de uma importacao autorizada
      operationId: getStudentImport
      security:
        - bearerToken: []
