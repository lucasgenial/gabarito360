<!doctype html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="../../../apps/web/public/css/app-conteudo-legado.css"><link rel="stylesheet" href="../../../apps/web/public/css/tabelas.css"><link rel="stylesheet" href="../../../apps/web/public/css/marca.css"><link rel="stylesheet" href="../../../apps/web/public/css/estado-tela.css"><link rel="stylesheet" href="../../../apps/web/public/css/painel-indicadores.css"><link rel="stylesheet" href="../../../apps/web/public/css/arquivamento.css"><link rel="stylesheet" href="../../../apps/web/public/css/estrutura-app.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Campo — prévia</title><style>/* Só a moldura da prévia; usa tokens. */.ds-legenda{font-size:12px;line-height:16px;color:var(--muted);margin:0 0 8px}.ds-linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}</style></head>
<body class="area-logada tw2-app">
<main style="padding:16px">
<p class="ds-legenda">Legado</p>
<div class="field">
  <label for="nome">Nome da turma</label>
  <input class="input" id="nome" name="nome" value="7º ano A" aria-describedby="nome-ajuda">
  <p class="field-help" id="nome-ajuda">Use o nome que aparece no diário.</p>
</div>
<div class="field">
  <label for="ano">Ano letivo</label>
  <select class="select" id="ano"><option>2026</option><option>2025</option></select>
</div>
<div class="tw2-app tela-turmas">
  <p class="ds-legenda">TW2: telas de Turmas</p>
  <div class="field">
    <label for="busca">Busca</label>
    <input class="input" id="busca" name="busca" placeholder="Nome da turma" aria-describedby="busca-ajuda">
    <p class="field-help" id="busca-ajuda">Busca pelo nome ou pela série.</p>
  </div>
</div>
</main>
</body>
</html>
