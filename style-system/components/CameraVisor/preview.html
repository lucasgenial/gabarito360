<!doctype html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="../../../apps/web/public/css/app-conteudo-legado.css"><link rel="stylesheet" href="../../../apps/web/public/css/tabelas.css"><link rel="stylesheet" href="../../../apps/web/public/css/marca.css"><link rel="stylesheet" href="../../../apps/web/public/css/estado-tela.css"><link rel="stylesheet" href="../../../apps/web/public/css/painel-indicadores.css"><link rel="stylesheet" href="../../../apps/web/public/css/arquivamento.css"><link rel="stylesheet" href="../../../apps/web/public/css/estrutura-app.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Visor da câmera — prévia</title><style>/* Só a moldura da prévia; usa tokens. */.ds-legenda{font-size:12px;line-height:16px;color:var(--muted);margin:0 0 8px}.ds-linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}</style></head>
<body class="area-logada tw2-app">
<main style="">
<div id="cam-tela" class="cam-tela">
  <canvas id="cam-canvas"></canvas>
  <video id="cam-video" playsinline muted style="display:none;"></video>
  <div class="cam-topo">
    <span id="cam-dica">Encaixe os 4 quadrados pretos nas guias</span>
    <button type="button" class="cam-btn-redondo" id="cam-fechar" aria-label="Fechar câmera">✕</button>
  </div>
  <div id="cam-ultimo" class="cam-ultimo"></div>
  <div class="cam-base">
    <button type="button" class="cam-btn-redondo" id="cam-luz" aria-label="Lanterna" style="visibility:hidden;"><svg class="nav-icone" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l-1 5H9z"/><path d="M9 8l1 13h4l1-13"/><path d="M12 12v3"/></svg></button>
    <button type="button" class="cam-disparo" id="cam-disparo" aria-label="Tirar foto"></button>
    <label class="cam-auto"><input type="checkbox" id="cam-auto-chk" checked style="width:20px;height:20px;"> Auto</label>
  </div>
</div>
</main>
</body>
</html>
