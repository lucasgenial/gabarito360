<!doctype html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="../../../apps/web/public/css/app-conteudo-legado.css"><link rel="stylesheet" href="../../../apps/web/public/css/tabelas.css"><link rel="stylesheet" href="../../../apps/web/public/css/marca.css"><link rel="stylesheet" href="../../../apps/web/public/css/estado-tela.css"><link rel="stylesheet" href="../../../apps/web/public/css/painel-indicadores.css"><link rel="stylesheet" href="../../../apps/web/public/css/arquivamento.css"><link rel="stylesheet" href="../../../apps/web/public/css/estrutura-app.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Toast — prévia</title><style>/* Só a moldura da prévia; usa tokens. */.ds-legenda{font-size:12px;line-height:16px;color:var(--muted);margin:0 0 8px}.ds-linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}</style></head>
<body class="area-logada tw2-app">
<main style="padding:16px">
<div id="g360-notificacoes" class="no-print" aria-label="Notificações">
  <div class="g360-toaster">
    <div class="sldt-active">
      <div class="g360-toast g360-toast-sucesso" role="status" aria-live="polite" style="background:var(--surface);color:var(--fg);border:1px solid var(--border-soft);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:12px;max-width:360px">
        <div class="g360-toast-conteudo" data-g360-toast="g360-1"><div><strong>Concluído</strong><p>Turma salva.</p></div><button type="button" class="g360-toast-fechar" aria-label="Fechar notificação">×</button></div>
      </div>
    </div>
    <div class="sldt-active">
      <div class="g360-toast g360-toast-erro" role="alert" aria-live="assertive" style="background:var(--surface);color:var(--fg);border:1px solid var(--border-soft);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:12px;max-width:360px">
        <div class="g360-toast-conteudo" data-g360-toast="g360-2"><div><strong>Não foi possível concluir</strong><p>A conexão caiu. Tente de novo.</p></div><button type="button" class="g360-toast-fechar" aria-label="Fechar notificação">×</button></div>
      </div>
    </div>
    <div class="sldt-active">
      <div class="g360-toast g360-toast-carregando" role="status" aria-live="polite" style="background:var(--surface);color:var(--fg);border:1px solid var(--border-soft);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:12px;max-width:360px">
        <div class="g360-toast-conteudo" data-g360-toast="g360-3"><div><strong>Em andamento</strong><p>Enviando 12 cartões.</p></div><button type="button" class="g360-toast-fechar" aria-label="Fechar notificação">×</button></div>
      </div>
    </div>
  </div>
</div>
</main>
</body>
</html>
