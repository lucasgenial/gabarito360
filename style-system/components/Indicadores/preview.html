<!doctype html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="../../../apps/web/public/css/app-conteudo-legado.css"><link rel="stylesheet" href="../../../apps/web/public/css/tabelas.css"><link rel="stylesheet" href="../../../apps/web/public/css/marca.css"><link rel="stylesheet" href="../../../apps/web/public/css/estado-tela.css"><link rel="stylesheet" href="../../../apps/web/public/css/painel-indicadores.css"><link rel="stylesheet" href="../../../apps/web/public/css/arquivamento.css"><link rel="stylesheet" href="../../../apps/web/public/css/estrutura-app.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Indicadores (KPI) — prévia</title><style>/* Só a moldura da prévia; usa tokens. */.ds-legenda{font-size:12px;line-height:16px;color:var(--muted);margin:0 0 8px}.ds-linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}</style></head>
<body class="area-logada tw2-app">
<main style="padding:16px">
<div class="g-indicadores">
  <div class="g-indicador"><div class="g-indicador-rotulo">Alunos</div><div class="g-indicador-valor">54</div><div class="g-indicador-detalhe">matrículas ativas</div></div>

</div>
<div class="kpi-grid">
  <div class="card kpi"><div class="kpi-label">Média da prova</div><div class="kpi-value">7,4</div><div class="kpi-trend up">acima da meta</div></div>
  <div class="card kpi"><div class="kpi-label">Aprovados</div><div class="kpi-value">41</div><div class="kpi-trend down">3 a menos que a última prova</div></div>
</div>
</main>
