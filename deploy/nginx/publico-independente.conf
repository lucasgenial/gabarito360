# Incluir dentro do server existente. A home não depende de PHP, Redis ou banco.
location = / {
    root /var/www/gabarito360-publico/current;
    try_files /index.html =503;
}
location ~ "^/_institucional/([a-f0-9]{64})\.css$" {
    alias /var/www/gabarito360-publico/assets/$1.css;
}
location = /_g360_manutencao.html {
    internal;
    alias /var/www/gabarito360-publico/current/manutencao.html;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
}
location @g360_api_manutencao {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"message":"Sistema em manutenção. Tente novamente em instantes."}';
}
