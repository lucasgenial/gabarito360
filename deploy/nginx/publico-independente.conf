# Incluir dentro do server existente. A home não depende de PHP, Redis ou banco.
location = / {
    root /var/www/gabarito360-publico/current;
    try_files /index.html =503;
    add_header Cache-Control "no-cache" always;
}
location ~ "^/_institucional/([a-f0-9]{64})\.css$" {
    alias /var/www/gabarito360-publico/assets/$1.css;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}
# Caminhos fechados por famílias; o publisher só instala a whitelist do helper.
location ~ "^/_institucional/marca-([a-f0-9]{64})/(css/(?:app|marca)\.css|js/app\.js|fonts/brand/[A-Za-z0-9_-]+\.(?:woff2|txt)|brand/[A-Za-z0-9_-]+\.(?:svg|png)|images/avatares/estudantes-v1\.png|[A-Za-z0-9_-]+\.(?:png|ico|svg|json|webmanifest))$" {
    alias /var/www/gabarito360-publico/assets/marca-$1/$2;
    disable_symlinks on;
    types {
        text/css css;
        application/javascript js;
        font/woff2 woff2;
        image/svg+xml svg;
        image/png png;
        image/x-icon ico;
        application/json json;
        application/manifest+json webmanifest;
        text/plain txt;
    }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}
# Nunca enviar um asset institucional ausente para PHP/FastCGI.
location /_institucional/ {
    return 404;
}
location = /_g360_manutencao.html {
    internal;
    alias /var/www/gabarito360-publico/current/manutencao.html;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
}
location @g360_api_manutencao {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"message":"Sistema em manutenção. Tente novamente em instantes."}';
}
