server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /home/lucasdev/projetos/gabarito360/apps/web/public;
    index index.php index.html;

    access_log /var/log/nginx/gabarito360.access.log;
    error_log /var/log/nginx/gabarito360.error.log;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location = /api/v1 {
        try_files /__missing__ @gabarito360_api;
    }

    location ^~ /api/v1/ {
        try_files /__missing__ @gabarito360_api;
    }

    location / {
        try_files $uri @gabarito360_web;
    }

    location @gabarito360_web {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/lucasdev/projetos/gabarito360/apps/web/public/index.php;
        fastcgi_param DOCUMENT_ROOT /home/lucasdev/projetos/gabarito360/apps/web/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTPS off;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location @gabarito360_api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/lucasdev/projetos/gabarito360/apps/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT /home/lucasdev/projetos/gabarito360/apps/api/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTPS off;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }
}
