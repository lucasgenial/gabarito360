name: Gabarito360 CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Composer, Pint, tests and OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: gabarito360_testing
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 3306
      DB_TEST_DATABASE: gabarito360_testing
      DB_TEST_USERNAME: root
      DB_TEST_PASSWORD: root
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=critical

      - name: Build frontend assets
        run: npm run build

      - name: Run migrations and seed access control
        run: php artisan migrate:fresh --seed --env=testing --force

      - name: Check code style
        run: php vendor/bin/pint --test

      - name: Run test suite
        run: php artisan test

      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@2.32.0 lint ../docs/openapi.yaml

  omr:
    name: OMR contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: omr/requirements.txt

      - name: Install OMR dependencies
        run: python -m pip install -r omr/requirements.txt

      - name: Run OMR contract tests
        run: python -m pytest omr/tests -q

  mobile:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter application
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

  containers:
    name: Containers and restore verification
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare isolated environment
        run: |
          cp .env.docker.example .env.docker
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env.docker

      - name: Validate Compose contract
        shell: pwsh
        run: ./scripts/infra/validate-compose.ps1

      - name: Build application images
        run: docker compose --env-file .env.docker -f compose.yaml build app nginx

      - name: Start isolated environment
        run: docker compose --env-file .env.docker -f compose.yaml up -d --wait

      - name: Verify HTTP health
        run: |
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8080/api/v1/health
          curl --fail --location --output /tmp/gabarito360-login.html http://127.0.0.1:8080/login
          grep --quiet "Gabarito360" /tmp/gabarito360-login.html

      - name: Verify backup and isolated restore
        shell: pwsh
        run: ./scripts/infra/verify-restore.ps1

      - name: Show service logs after failure
        if: failure()
        run: docker compose --env-file .env.docker -f compose.yaml logs --no-color

      - name: Stop isolated environment
        if: always()
        run: docker compose --env-file .env.docker -f compose.yaml down -v --remove-orphans
