name: Verificação

on:
  pull_request:
  push:
    branches: [main]

jobs:
  auditoria-recuperacao:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: teste-local-ci
          MARIADB_DATABASE: g360_auditoria_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      APP_ENV: testing
      G360_AUDITORIA_ENSAIO: '1'
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_DATABASE: g360_auditoria_ci
      DB_USERNAME: root
      DB_PASSWORD: teste-local-ci
      AUDITORIA_DB_USERNAME: au1_writer_ci
      AUDITORIA_DB_PASSWORD: senha-ficticia-ci
      REDIS_HOST: 127.0.0.1
      REDIS_MAX_RETRIES: '0'
      QUEUE_CONNECTION: redis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql, redis
      - run: mkdir -p apps/api/bootstrap/cache apps/api/storage/framework/cache apps/api/storage/framework/sessions apps/api/storage/framework/views apps/api/storage/logs
      - run: composer install --working-dir=apps/api --no-interaction --no-progress
      - run: |
          cd apps/api
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - run: php scripts/auditoria/ensaio-fila.php preparar
      - name: Identificar Redis descartável
        run: |
          redis_ensaio=$(docker ps -q --filter ancestor=redis:7-alpine)
          [[ "$redis_ensaio" =~ ^[a-f0-9]{12,64}$ ]]
          echo "AUDITORIA_REDIS_CONTAINER=$redis_ensaio" >> "$GITHUB_ENV"
      - run: docker stop "$AUDITORIA_REDIS_CONTAINER"
      - run: php scripts/auditoria/ensaio-fila.php indisponivel
      - run: docker start "$AUDITORIA_REDIS_CONTAINER"
      - run: |
          for tentativa in $(seq 1 20); do
            if docker exec "$AUDITORIA_REDIS_CONTAINER" redis-cli ping; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Restaurar banco e fila em contêineres novos
        run: bash scripts/auditoria/ensaio-restauracao.sh

  telas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/verificar_telas.py
      - run: node --test scripts/tests/cartoes-fila.test.mjs
      - run: npm install --prefix scripts/auditoria --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: node scripts/auditoria/contexto-abas.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: |
          bash -n scripts/operacao/deploy.sh
          bash -n infra/deploy.sh
          bash -n scripts/operacao/pausa-backup-final.sh
          sudo python3 scripts/tests/test_deploy.py
          sudo python3 scripts/tests/test_pausa_backup.py
          sudo python3 scripts/tests/test_confirmar_backup.py

  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  integridade-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: teste-local-ci
          MARIADB_DATABASE: g360_t2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: apps/api
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_DATABASE: g360_t2_test
      DB_USERNAME: root
      DB_PASSWORD: teste-local-ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test --filter='IntegridadeEspacosMariaDbTest|VinculosMariaDbTest|SelecaoVinculoTest|ConviteInterfaceTest|PerfisEspacoTest|DadosPessoaisTest|PlanejamentoConsultasMariaDbTest|IntegracaoPessoalTest|CadastroClienteTest|AcessosInternosTest|SelecaoInternaTest|GestaoAcessosInternosTest|SecretarioEscolarTest|ClientesInterfaceTest|AuditoriaTest|ConferenciaAuditoriaTest|ArquivoMensalAuditoriaTest'
