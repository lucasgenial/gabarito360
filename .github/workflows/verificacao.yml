name: Verificação

on:
  pull_request:
  push:
    branches: [main]

jobs:
  auditoria-recuperacao:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: teste-local-ci
          MARIADB_DATABASE: g360_auditoria_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      APP_ENV: testing
      G360_AUDITORIA_ENSAIO: '1'
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_DATABASE: g360_auditoria_ci
      DB_USERNAME: root
      DB_PASSWORD: teste-local-ci
      AUDITORIA_DB_USERNAME: au1_writer_ci
      AUDITORIA_DB_PASSWORD: senha-ficticia-ci
      REDIS_HOST: 127.0.0.1
      REDIS_MAX_RETRIES: '0'
      QUEUE_CONNECTION: redis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql, redis
      - run: mkdir -p apps/api/bootstrap/cache apps/api/storage/framework/cache apps/api/storage/framework/sessions apps/api/storage/framework/views apps/api/storage/logs
      - run: composer install --working-dir=apps/api --no-interaction --no-progress
      - run: |
          cd apps/api
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - run: php scripts/auditoria/ensaio-fila.php preparar
      - run: php scripts/auditoria/ensaio-copias.php preparar
      - name: Identificar Redis descartável
        run: |
          redis_ensaio=$(docker ps -q --filter ancestor=redis:7-alpine)
          [[ "$redis_ensaio" =~ ^[a-f0-9]{12,64}$ ]]
          echo "AUDITORIA_REDIS_CONTAINER=$redis_ensaio" >> "$GITHUB_ENV"
      - run: docker stop "$AUDITORIA_REDIS_CONTAINER"
      - run: php scripts/auditoria/ensaio-fila.php indisponivel
      - run: php scripts/auditoria/ensaio-copias.php indisponivel
      - run: docker start "$AUDITORIA_REDIS_CONTAINER"
      - run: |
          for tentativa in $(seq 1 20); do
            if docker exec "$AUDITORIA_REDIS_CONTAINER" redis-cli ping; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Restaurar banco e fila em contêineres novos
        run: bash scripts/auditoria/ensaio-restauracao.sh

  governanca:
    # FN-078: princípios verificados automaticamente (ADR-0053).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m unittest scripts/tests/test_verificar_autoria.py scripts/tests/test_principios.py scripts/tests/test_regras_codigo.py scripts/tests/test_fn_no_pr.py scripts/tests/test_conformidade_fn.py
      - name: Executar as regras ativas dos princípios (docs/decisoes/regras.yml)
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          HEAD_PR: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
          PR_TITULO: ${{ github.event.pull_request.title }}
          PR_CORPO: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            INTERVALO="$BASE_PR..$HEAD_PR"
          elif [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
            INTERVALO="$DEPOIS~1..$DEPOIS"
          else
            INTERVALO="$ANTES..$DEPOIS"
          fi
          export INTERVALO
          python3 scripts/executar_regras.py

  telas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/verificar_telas.py
      - run: npm ci --prefix scripts/tailwind --ignore-scripts --no-audit --no-fund
      - run: node scripts/tailwind/build.mjs && git diff --exit-code -- apps/web/public/previas/tailwind apps/web/public/css/estrutura-app.css apps/web/public/css/app-conteudo-legado.css
      - run: npm ci --prefix scripts/paineis-grid --ignore-scripts --no-audit --no-fund
      - run: node scripts/paineis-grid/build.mjs && git diff --exit-code -- apps/web/public/js/painel-grade.js apps/web/public/css/painel-grade.css apps/web/public/js/editor-paineis.js apps/web/public/css/editor-paineis.css apps/web/public/js/libs/gridstack apps/web/public/js/libs/sortablejs
      - run: npm ci --prefix previas/editor-paineis --ignore-scripts --no-audit --no-fund && npm test --prefix previas/editor-paineis
      - run: node --test scripts/tests/editor-paineis.test.mjs
      - run: npm ci --prefix scripts/calendario --ignore-scripts --no-audit --no-fund
      - run: node scripts/calendario/build.mjs && git diff --exit-code -- apps/web/public/js/painel-agenda.js apps/web/public/css/painel-agenda.css apps/web/public/js/libs/calendarjs
      - run: npm ci --prefix scripts/graficos --ignore-scripts --no-audit --no-fund
      - run: node scripts/graficos/build.mjs && git diff --exit-code -- apps/web/public/js/turma-graficos.js apps/web/public/js/libs/echarts apps/web/public/js/libs/echarts-g360.min.js
      - run: npm ci --prefix scripts/notificacoes --ignore-scripts --no-audit --no-fund
      - run: node scripts/notificacoes/build.mjs && git diff --exit-code -- apps/web/public/js/notificacoes.js apps/web/public/js/libs/solid-js apps/web/public/js/libs/solid-toast
      - run: python3 -m pip install -r apps/api/omr/requirements.txt pypdf
      - run: python3 scripts/tests/test_resultados_pdf.py
      - run: python3 scripts/tests/test_painel_turma_pdf.py
      - run: python3 scripts/tests/test_qualidade_omr.py
      - run: node --test scripts/tests/painel-linhas.test.mjs scripts/tests/painel-grade.test.mjs scripts/tests/cartoes-fila.test.mjs scripts/tests/cartoes-miniaturas.test.mjs scripts/tests/turma-abas-adiadas.test.mjs scripts/tests/turma-graficos-ciclo.test.mjs scripts/tests/catalogo-instituicoes.test.mjs scripts/tests/catalogo-cadastro.test.mjs scripts/tests/preparo-foto-codecs.test.mjs scripts/tests/preparo-foto-geometria.test.mjs scripts/tests/preparo-foto-cancelamento.test.mjs scripts/tests/contexto-sessao.test.mjs scripts/tests/requisicao-recursos.test.mjs scripts/tests/contexto-reset.test.mjs scripts/tests/painel-indicadores.test.mjs
      - run: npm install --prefix scripts/auditoria --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: node scripts/auditoria/previa-componentes.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/auditoria/navegacao-recursos.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/auditoria/contexto-abas.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/auditoria/revisao-modal.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/auditoria/painel-cartao.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/auditoria/carregamento-notificacoes.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/auditoria/historico-regional.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/auditoria/leituras-relatorios.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: |
          bash -n scripts/operacao/deploy.sh
          bash -n infra/deploy.sh
          bash -n scripts/operacao/pausa-backup-final.sh
          bash -n scripts/operacao/preparar-release.sh
          bash -n scripts/operacao/publicar-fase.sh
          bash -n scripts/operacao/publicar-home.sh
          sudo python3 scripts/tests/test_deploy.py
          sudo python3 scripts/tests/test_pausa_backup.py
          sudo python3 scripts/tests/test_confirmar_backup.py
      - run: sudo apt-get update && sudo apt-get install -y nginx php-cli
      - run: sudo python3 scripts/tests/test_publico_nginx.py
      - run: sudo python3 scripts/tests/test_publicar_home.py

  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - name: Auditar dependências de runtime fixadas no lock
        run: composer audit --locked --no-dev
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      - name: Renderizar percurso TW2 e conferir estrutura no navegador
        if: matrix.app == 'web'
        run: |
          G360_TW2_EXPORT=1 php artisan test --filter='EstruturaTailwindTest|TabelasWebTest|PaineisTurmasWebTest'
          cd ../..
          npm install --prefix scripts/auditoria --ignore-scripts --no-package-lock --no-audit --no-fund
          CHROME_PATH=/usr/bin/google-chrome node scripts/auditoria/estrutura-app.mjs
          CHROME_PATH=/usr/bin/google-chrome node scripts/auditoria/painel-hierarquia.mjs
      - name: Conferir exclusão real entre processos da sessão web
        if: matrix.app == 'web'
        working-directory: ${{ github.workspace }}
        run: |
          TASK_QA_UR3=$(mktemp -d /tmp/g360-ur3-ci-XXXXXX)
          ln -s "$GITHUB_WORKSPACE/apps/web/vendor" "$TASK_QA_UR3/vendor"
          python3 scripts/auditoria/mutex-sessao-adversarial.py --qa "$TASK_QA_UR3" --middleware "$GITHUB_WORKSPACE/apps/web/app/Http/Middleware/SerializarSessao.php"

  integridade-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: teste-local-ci
          MARIADB_DATABASE: g360_t2_test
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql:rw,size=1073741824
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: apps/api
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_DATABASE: g360_t2_test
      DB_USERNAME: root
      DB_PASSWORD: teste-local-ci
    steps:
      - uses: actions/checkout@v4
      - name: Conferir armazenamento e commits do MariaDB descartável
        run: python3 scripts/ci/verificar_mariadb_descartavel.py
        working-directory: ${{ github.workspace }}
        env:
          MARIADB_CONTAINER_ID: ${{ job.services.mariadb.id }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Conferir progresso primeiro no MariaDB
        run: php artisan test --filter=ProgressoCorrecaoTest
      - run: php artisan test --filter='EditorPainelTest|EditorPainelConcorrenciaMariaDbTest|OrganizacaoPainelTest|PreferenciasPainelTest|ArquivamentoCadastroTest|ArquivamentoConcorrenciaMariaDbTest|PainelTurmaAnaliseTest|VinculoDocenteComposto|PainelTurmaIndicadoresTest|TurmaCadastroExpandidoTest|TurmaRevisaoTest|DashboardDesempenhoContratoTest|F2DashboardLotesTest|F2JuncoesTest|F2RevogacaoConsultaTest|F2RelogioConsultaTest|F2ConsultaContratoTest|HierarquiaAcessoConsultasTest|ContextoVinculoTest|EscopoEspacosTest|ConsultasEspacosTest|CartoesFilaTest|CartoesEspacosTest|FilaVinculoTest|QualidadeCartaoTest|CurriculoProvaTest|CurriculoProvaConcorrenciaMariaDbTest|TurmaResumoDesempenhoTest|PeriodosAreasTest|AreasConhecimentoTest|OpcoesDisciplinaProvaTest|DisciplinasTest|Identidade|ImagemAluno|AlunosAvatarTest|GruposFuncionaisTest|ImagemUsuarioTest|Pf1PerfisEscolaresTest|ProvasAutoriaTest|SolicitacoesCatalogoTest|CatalogoConcorrenciaMariaDbTest|CatalogoPessoalTest|RelacoesCatalogoTest|PublicarCatalogoTest|ConciliarCatalogoTest|PrepararCatalogoTest|SiglaInstituicaoTest|DuplicarProvaTest|IntegridadeEspacosMariaDbTest|VinculosMariaDbTest|SelecaoVinculoTest|ConviteInterfaceTest|PerfisEspacoTest|DadosPessoaisTest|PlanejamentoConsultasMariaDbTest|IntegracaoPessoalTest|CadastroClienteTest|AcessosInternosTest|SelecaoInternaTest|GestaoAcessosInternosTest|SecretarioEscolarTest|ClientesInterfaceTest|AuditoriaTest|ConferenciaAuditoriaTest|ArquivoMensalAuditoriaTest|ElegibilidadeCopiaTest|LotesCopiaTest|OutboxCopiaTest|ExecucaoCopiaTest|PreviaCadastroCopiaTest|LotesCadastroCopiaTest|ExecucaoCadastroCopiaTest|ContinuidadeCopiaTest|PreviaResultadosCopiaTest|LotesResultadosCopiaTest|ExecucaoResultadosCopiaTest|AcompanhamentoCopiasTest|SelecaoMaterialCopiaTest|DecisaoMaterialCopiaTest|SelecaoCadastroCopiaTest|DecisaoCadastroCopiaTest|SelecaoResultadosCopiaTest|DecisaoResultadosCopiaTest|OperacaoCopiaTest|PedidosTitularesTest|AutorizacoesExportacaoTitularTest|GeracaoExportacaoTitularTest|EntregaExportacaoTitularTest|ExportacaoConcorrenciaMariaDbTest'
