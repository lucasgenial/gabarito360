name: Verificação

on:
  pull_request:
  push:
    branches: [main]

jobs:
  auditoria-recuperacao:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: teste-local-ci
          MARIADB_DATABASE: g360_auditoria_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      APP_ENV: testing
      G360_AUDITORIA_ENSAIO: '1'
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_DATABASE: g360_auditoria_ci
      DB_USERNAME: root
      DB_PASSWORD: teste-local-ci
      AUDITORIA_DB_USERNAME: au1_writer_ci
      AUDITORIA_DB_PASSWORD: senha-ficticia-ci
      REDIS_HOST: 127.0.0.1
      REDIS_MAX_RETRIES: '0'
      QUEUE_CONNECTION: redis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql, redis
      - run: mkdir -p apps/api/bootstrap/cache apps/api/storage/framework/cache apps/api/storage/framework/sessions apps/api/storage/framework/views apps/api/storage/logs
      - run: composer install --working-dir=apps/api --no-interaction --no-progress
      - run: |
          cd apps/api
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - run: php scripts/auditoria/ensaio-fila.php preparar
      - run: php scripts/auditoria/ensaio-copias.php preparar
      - name: Identificar Redis descartável
        run: |
          redis_ensaio=$(docker ps -q --filter ancestor=redis:7-alpine)
          [[ "$redis_ensaio" =~ ^[a-f0-9]{12,64}$ ]]
          echo "AUDITORIA_REDIS_CONTAINER=$redis_ensaio" >> "$GITHUB_ENV"
      - run: docker stop "$AUDITORIA_REDIS_CONTAINER"
      - run: php scripts/auditoria/ensaio-fila.php indisponivel
      - run: php scripts/auditoria/ensaio-copias.php indisponivel
      - run: docker start "$AUDITORIA_REDIS_CONTAINER"
      - run: |
          for tentativa in $(seq 1 20); do
            if docker exec "$AUDITORIA_REDIS_CONTAINER" redis-cli ping; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Restaurar banco e fila em contêineres novos
        run: bash scripts/auditoria/ensaio-restauracao.sh

  telas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/verificar_telas.py
      - run: npm ci --prefix scripts/notificacoes --ignore-scripts --no-audit --no-fund
      - run: node scripts/notificacoes/build.mjs && git diff --exit-code -- apps/web/public/js/notificacoes.js apps/web/public/js/libs/solid-js apps/web/public/js/libs/solid-toast
      - run: python3 -m pip install -r apps/api/omr/requirements.txt pypdf
      - run: python3 scripts/tests/test_resultados_pdf.py
      - run: python3 scripts/tests/test_qualidade_omr.py
      - run: node --test scripts/tests/cartoes-fila.test.mjs scripts/tests/catalogo-instituicoes.test.mjs scripts/tests/catalogo-cadastro.test.mjs scripts/tests/preparo-foto-codecs.test.mjs scripts/tests/preparo-foto-geometria.test.mjs scripts/tests/preparo-foto-cancelamento.test.mjs scripts/tests/contexto-sessao.test.mjs scripts/tests/requisicao-recursos.test.mjs scripts/tests/contexto-reset.test.mjs
      - run: npm install --prefix scripts/auditoria --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: node scripts/auditoria/navegacao-recursos.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/auditoria/contexto-abas.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/auditoria/revisao-modal.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/auditoria/painel-cartao.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/auditoria/carregamento-notificacoes.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/auditoria/historico-regional.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/auditoria/leituras-relatorios.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: |
          bash -n scripts/operacao/deploy.sh
          bash -n infra/deploy.sh
          bash -n scripts/operacao/pausa-backup-final.sh
          bash -n scripts/operacao/preparar-release.sh
          bash -n scripts/operacao/publicar-fase.sh
          bash -n scripts/operacao/publicar-home.sh
          sudo python3 scripts/tests/test_deploy.py
          sudo python3 scripts/tests/test_pausa_backup.py
          sudo python3 scripts/tests/test_confirmar_backup.py
      - run: sudo apt-get update && sudo apt-get install -y nginx php-cli
      - run: sudo python3 scripts/tests/test_publico_nginx.py
      - run: sudo python3 scripts/tests/test_publicar_home.py

  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - name: Auditar dependências de runtime fixadas no lock
        run: composer audit --locked --no-dev
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      - name: Conferir exclusão real entre processos da sessão web
        if: matrix.app == 'web'
        working-directory: ${{ github.workspace }}
        run: |
          TASK_QA_UR3=$(mktemp -d /tmp/g360-ur3-ci-XXXXXX)
          ln -s "$GITHUB_WORKSPACE/apps/web/vendor" "$TASK_QA_UR3/vendor"
          python3 scripts/auditoria/mutex-sessao-adversarial.py --qa "$TASK_QA_UR3" --middleware "$GITHUB_WORKSPACE/apps/web/app/Http/Middleware/SerializarSessao.php"

  integridade-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: teste-local-ci
          MARIADB_DATABASE: g360_t2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: apps/api
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_DATABASE: g360_t2_test
      DB_USERNAME: root
      DB_PASSWORD: teste-local-ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Conferir progresso primeiro no MariaDB
        run: php artisan test --filter=ProgressoCorrecaoTest
      - run: php artisan test --filter='DashboardDesempenhoContratoTest|HierarquiaAcessoConsultasTest|ContextoVinculoTest|EscopoEspacosTest|ConsultasEspacosTest|CartoesFilaTest|CartoesEspacosTest|FilaVinculoTest|QualidadeCartaoTest|CurriculoProvaTest|CurriculoProvaConcorrenciaMariaDbTest|TurmaResumoDesempenhoTest|PeriodosAreasTest|AreasConhecimentoTest|OpcoesDisciplinaProvaTest|DisciplinasTest|Identidade|ImagemAluno|AlunosAvatarTest|GruposFuncionaisTest|ImagemUsuarioTest|Pf1PerfisEscolaresTest|ProvasAutoriaTest|SolicitacoesCatalogoTest|CatalogoConcorrenciaMariaDbTest|CatalogoPessoalTest|RelacoesCatalogoTest|PublicarCatalogoTest|ConciliarCatalogoTest|PrepararCatalogoTest|SiglaInstituicaoTest|DuplicarProvaTest|IntegridadeEspacosMariaDbTest|VinculosMariaDbTest|SelecaoVinculoTest|ConviteInterfaceTest|PerfisEspacoTest|DadosPessoaisTest|PlanejamentoConsultasMariaDbTest|IntegracaoPessoalTest|CadastroClienteTest|AcessosInternosTest|SelecaoInternaTest|GestaoAcessosInternosTest|SecretarioEscolarTest|ClientesInterfaceTest|AuditoriaTest|ConferenciaAuditoriaTest|ArquivoMensalAuditoriaTest|ElegibilidadeCopiaTest|LotesCopiaTest|OutboxCopiaTest|ExecucaoCopiaTest|PreviaCadastroCopiaTest|LotesCadastroCopiaTest|ExecucaoCadastroCopiaTest|ContinuidadeCopiaTest|PreviaResultadosCopiaTest|LotesResultadosCopiaTest|ExecucaoResultadosCopiaTest|AcompanhamentoCopiasTest|SelecaoMaterialCopiaTest|DecisaoMaterialCopiaTest|SelecaoCadastroCopiaTest|DecisaoCadastroCopiaTest|SelecaoResultadosCopiaTest|DecisaoResultadosCopiaTest|OperacaoCopiaTest|PedidosTitularesTest|AutorizacoesExportacaoTitularTest|GeracaoExportacaoTitularTest|EntregaExportacaoTitularTest|ExportacaoConcorrenciaMariaDbTest'
