# Dependabot (FN-078 subfase 4.2, ADR-0051).
# O robô abre o PR. O PR do robô nunca entra na main: a CI reprova autor robô.
# Para aplicar a atualização, adote o PR em nome do responsável:
#   python scripts/adotar_pr_dependabot.py <número do PR>
# Roteiro: docs/operacao/dependencias.md
version: 2
updates:
  - package-ecosystem: composer
    directories: ["/apps/api", "/apps/web"]
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: America/Bahia}
    open-pull-requests-limit: 5
    labels: ["dependencias"]
    commit-message: {prefix: "chore(deps)"}
    groups:
      composer-menores: {update-types: ["minor", "patch"]}

  - package-ecosystem: npm
    directories:
      - "/previas/editor-paineis"
      - "/scripts/calendario"
      - "/scripts/graficos"
      - "/scripts/notificacoes"
      - "/scripts/paineis-grid"
      - "/scripts/tailwind"
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: America/Bahia}
    open-pull-requests-limit: 5
    labels: ["dependencias"]
    commit-message: {prefix: "chore(deps)"}
    groups:
      npm-menores: {update-types: ["minor", "patch"]}

  - package-ecosystem: pip
    directories: ["/apps/api/omr", "/scripts/branding"]
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: America/Bahia}
    open-pull-requests-limit: 5
    labels: ["dependencias"]
    commit-message: {prefix: "chore(deps)"}
    groups:
      pip-menores: {update-types: ["minor", "patch"]}

  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    labels: ["dependencias"]
    commit-message: {prefix: "chore(deps)"}
