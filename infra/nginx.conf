# ============================================================
# Gabarito360 — Nginx (mesmo servidor, dois virtual hosts)
# ============================================================
# Copiar para: /etc/nginx/sites-available/gabarito360
# Ativar com:  ln -s /etc/nginx/sites-available/gabarito360 /etc/nginx/sites-enabled/
# SSL via:     certbot --nginx -d gabarito360.com.br -d api.gabarito360.com.br
# ============================================================

# Não registrar query, Referer, cookies ou Authorization nos acessos.
# Este arquivo é incluído no contexto http do Nginx.
log_format g360_privado '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time';

# WEB — gabarito360.com.br
server {
    listen 80;
    server_name gabarito360.com.br www.gabarito360.com.br;

    root /var/www/gabarito360/apps/web/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Arquivos dos usuários só podem passar pelos controllers autenticados.
    location = /storage { return 404; }
    location ^~ /storage/ { return 404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/gabarito360-web-access.log g360_privado;
    error_log  /var/log/nginx/gabarito360-web-error.log;
}

# API — api.gabarito360.com.br
server {
    listen 80;
    server_name api.gabarito360.com.br;

    root /var/www/gabarito360/apps/api/public;
    index index.php;

    charset utf-8;
    client_max_body_size 50M;

    location = /storage { return 404; }
    location ^~ /storage/ { return 404; }

    add_header Access-Control-Allow-Origin "https://gabarito360.com.br" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true" always;

    location / {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/gabarito360-api-access.log g360_privado;
    error_log  /var/log/nginx/gabarito360-api-error.log;
}
