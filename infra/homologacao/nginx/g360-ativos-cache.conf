# F3 (docs/198) — incluir no server web da homologação DEPOIS de "location ~ /\. { deny all; }":
#   include /etc/nginx/snippets/g360-ativos-cache.conf;
# Só arquivos técnicos públicos existentes em apps/web/public. HTML, PHP, /api, fotos e documentos
# continuam com o Cache-Control "no-store" do server. add_header num location substitui os do server,
# por isso X-Robots-Tag e nosniff são repetidos aqui. auth_basic é herdado do server.
location ~* \.(?:css|js|woff2|webp|png|svg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control $g360_cache_ativo always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
}
