# F3 (docs/198) — contexto http: /etc/nginx/conf.d/g360-ativos-map.conf
# URL com versão de conteúdo (?v= de 16 hexadecimais, helper Ativos::url) pode ser imutável.
# Sem versão: revalidar sempre (ETag/304). "private": a borda não compartilha o que está atrás da Basic Auth.
map $arg_v $g360_cache_ativo {
    "~^[a-f0-9]{16}$" "private, max-age=31536000, immutable";
    default "private, no-cache";
}
