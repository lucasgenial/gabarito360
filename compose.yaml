name: ${COMPOSE_PROJECT_NAME:-gabarito360}

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-Gabarito360}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?Defina APP_KEY no arquivo de ambiente}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_LOCALE: ${APP_LOCALE:-pt_BR}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-pt_BR}
  APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-pt_BR}
  TRUSTED_PROXIES: "*"
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_STACK: ${LOG_STACK:-daily}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-14}
  DB_CONNECTION: mariadb
  DB_HOST: mariadb
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-gabarito360}
  DB_USERNAME: ${DB_USERNAME:-gabarito360}
  DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo de ambiente}
  SESSION_DRIVER: redis
  SESSION_ENCRYPT: "true"
  CACHE_STORE: redis
  CACHE_PREFIX: ${CACHE_PREFIX:-gabarito360_cache_}
  QUEUE_CONNECTION: redis
  QUEUE_FAILED_DRIVER: database-uuids
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo de ambiente}
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_QUEUE_DB: 2
  REDIS_PREFIX: ${REDIS_PREFIX:-gabarito360_}
  REDIS_CACHE_CONNECTION: cache
  REDIS_QUEUE_CONNECTION: queue
  REDIS_QUEUE: gabarito360
  FILESYSTEM_DISK: private
  FILESYSTEM_PRIVATE_DISK: private
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:-gabarito360}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-gabarito360-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Defina REVERB_APP_SECRET no arquivo de ambiente}
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8080
  REVERB_SCALING_ENABLED: "true"
  REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-localhost,127.0.0.1}
  GABARITO360_OMR_PYTHON_BINARY: /opt/omr/bin/python
  GABARITO360_OMR_CONFIG_PATH: /var/www/omr/config/model-v1.pre-homologation.json
  GABARITO360_OMR_TIMEOUT_SECONDS: 20
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-nao-responder@gabarito360.local}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Gabarito360}

x-app-service: &app-service
  image: gabarito360/app:${G360_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: infra/docker/app/Dockerfile
    args:
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-gabarito360-key}
      VITE_REVERB_HOST: ${G360_REVERB_PUBLIC_HOST:-}
      VITE_REVERB_PORT: ${G360_REVERB_PUBLIC_PORT:-8080}
      VITE_REVERB_SCHEME: ${G360_REVERB_PUBLIC_SCHEME:-http}
  environment: *app-environment
  volumes:
    - app-storage:/var/www/html/storage
    - app-cache:/var/www/html/bootstrap/cache
  networks:
    - internal
  restart: unless-stopped

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-gabarito360}
      MARIADB_USER: ${DB_USERNAME:-gabarito360}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo de ambiente}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Defina MARIADB_ROOT_PASSWORD no arquivo de ambiente}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo de ambiente}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app-service
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-service
    networks:
      - edge
      - internal
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--only=environment"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  queue:
    <<: *app-service
    command: ["php", "artisan", "queue:work", "redis", "--queue=gabarito360", "--sleep=1", "--tries=2", "--timeout=60", "--max-time=3600"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s

  scheduler:
    <<: *app-service
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  reverb:
    <<: *app-service
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    networks:
      - edge
      - internal
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--only=environment"]
      interval: 15s
      timeout: 10s
      retries: 5

  nginx:
    image: gabarito360/nginx:${G360_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/nginx/Dockerfile
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-gabarito360-key}
        VITE_REVERB_HOST: ${G360_REVERB_PUBLIC_HOST:-}
        VITE_REVERB_PORT: ${G360_REVERB_PUBLIC_PORT:-8080}
        VITE_REVERB_SCHEME: ${G360_REVERB_PUBLIC_SCHEME:-http}
    ports:
      - "${G360_HTTP_PORT:-8080}:80"
    networks:
      - edge
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app-cache:
  app-storage:
  mariadb-data:
  redis-data:

networks:
  edge:
  internal:
    internal: true
